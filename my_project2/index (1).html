<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냉프렌드 - 자취생 냉장고 관리 웹앱</title>
<style>
/* ===== 기본 리셋 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-900: #0d3b66;
  --blue-700: #1d5a9e;
  --blue-500: #3b82c4;
  --blue-100: #e7f0fb;
  --warning: #f59e0b;
  --danger: #e5484d;
  --success: #16a34a;
  --gray-100: #f5f6f8;
  --gray-300: #d9dee3;
  --gray-600: #5b6572;
  --gray-900: #1c2126;
  --radius: 12px;
}

body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--gray-100);
  color: var(--gray-900);
  line-height: 1.5;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 20px;
}

a { color: inherit; text-decoration: none; }
ul { list-style: none; }

/* ===== 헤더 (푸른 계열) ===== */
.site-header {
  background: linear-gradient(135deg, var(--blue-900), var(--blue-500));
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}

.logo { font-size: 1.3rem; font-weight: 700; }

.main-nav ul {
  display: flex;
  gap: 8px;
}

.nav-link {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: 500;
  transition: background 0.2s;
}

.nav-link:hover,
.nav-link.active {
  background: rgba(255,255,255,0.2);
}

.menu-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
}

.menu-toggle span {
  width: 24px;
  height: 2px;
  background: #fff;
  border-radius: 2px;
}

/* ===== 메인 ===== */
main.container {
  padding: 24px 20px 60px;
}

.tab-section { display: none; animation: fadeIn 0.3s ease; }
.tab-section.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  font-size: 1.5rem;
  color: var(--blue-900);
  margin-bottom: 16px;
  border-left: 4px solid var(--blue-500);
  padding-left: 10px;
}

.section-desc { color: var(--gray-600); margin-bottom: 16px; }

/* 알림 배너 */
.alert-banner {
  background: #fff4e5;
  border: 1px solid var(--warning);
  color: #92400e;
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  font-weight: 600;
}

/* 폼 */
.ingredient-form {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  background: #fff;
  padding: 20px;
  border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1 1 160px;
}

.form-group label {
  font-size: 0.85rem;
  color: var(--gray-600);
}

input, select, button {
  font: inherit;
}

input[type="text"], input[type="date"], select {
  padding: 10px 12px;
  border: 1px solid var(--gray-300);
  border-radius: 8px;
}

.btn {
  align-self: flex-end;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.btn-primary {
  background: var(--blue-700);
  color: #fff;
  transition: background 0.2s;
}
.btn-primary:hover { background: var(--blue-900); }

.btn-danger {
  background: var(--danger);
  color: #fff;
  padding: 6px 12px;
  font-size: 0.85rem;
  border-radius: 6px;
}

.list-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

/* 재료 목록 */
.ingredient-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}

.ingredient-item {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border-left: 5px solid var(--blue-500);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ingredient-item.soon { border-left-color: var(--warning); }
.ingredient-item.expired { border-left-color: var(--danger); background: #fff5f5; }

.item-name { font-weight: 700; font-size: 1.05rem; }
.item-meta { font-size: 0.85rem; color: var(--gray-600); }
.item-badge {
  align-self: flex-start;
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.badge-soon { background: #fef3c7; color: #92400e; }
.badge-expired { background: #fee2e2; color: #991b1b; }
.badge-fresh { background: var(--blue-100); color: var(--blue-700); }

.empty-message {
  color: var(--gray-600);
  text-align: center;
  padding: 30px 0;
}

/* 요리 추천 */
.recipe-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

.recipe-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.recipe-card h3 { color: var(--blue-900); margin-bottom: 6px; }
.recipe-card .used-tag {
  display: inline-block;
  background: var(--blue-100);
  color: var(--blue-700);
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 10px;
  margin: 2px 4px 2px 0;
}

/* 통계 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.stat-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border-top: 4px solid var(--blue-500);
}
.stat-card.warning { border-top-color: var(--warning); }
.stat-card.danger { border-top-color: var(--danger); }
.stat-card.success { border-top-color: var(--success); }

.stat-number { display: block; font-size: 2rem; font-weight: 800; color: var(--blue-900); }
.stat-label { font-size: 0.85rem; color: var(--gray-600); }

.category-stats {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.category-stats h3 { margin-bottom: 10px; color: var(--blue-900); }
.category-stats li {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed var(--gray-300);
}

/* 푸터 */
.site-footer {
  background: var(--blue-900);
  color: #cbd9ea;
  text-align: center;
  padding: 20px 0;
  font-size: 0.85rem;
}

/* ===== 반응형 ===== */
@media (max-width: 768px) {
  .ingredient-form { flex-direction: column; }
  .btn { align-self: stretch; }
}

@media (max-width: 640px) {
  .main-nav { display: none; }
  .main-nav.open {
    display: block;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--blue-900);
  }
  .main-nav.open ul {
    flex-direction: column;
    padding: 10px 20px 16px;
  }
  .menu-toggle { display: flex; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}

</style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">🧊 냉프렌드</h1>
      <nav class="main-nav" aria-label="주요 메뉴">
        <ul>
          <li><a href="#ingredients" class="nav-link active" data-tab="ingredients">재료 관리</a></li>
          <li><a href="#recipes" class="nav-link" data-tab="recipes">요리 추천</a></li>
          <li><a href="#stats" class="nav-link" data-tab="stats">통계</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container">

    <!-- 알림 배너 -->
    <div id="alertBanner" class="alert-banner" hidden role="alert"></div>

    <!-- 재료 관리 -->
    <section id="ingredients" class="tab-section active" aria-labelledby="ingredients-heading">
      <h2 id="ingredients-heading">재료 관리</h2>

      <form id="ingredientForm" class="ingredient-form">
        <div class="form-group">
          <label for="foodName">식재료 이름</label>
          <input type="text" id="foodName" name="foodName" placeholder="예: 계란" required>
        </div>
        <div class="form-group">
          <label for="expiryDate">유통기한</label>
          <input type="date" id="expiryDate" name="expiryDate" required>
        </div>
        <div class="form-group">
          <label for="foodCategory">분류</label>
          <select id="foodCategory" name="foodCategory">
            <option value="채소">채소</option>
            <option value="육류">육류</option>
            <option value="유제품">유제품</option>
            <option value="가공식품">가공식품</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">등록하기</button>
      </form>

      <div class="list-controls">
        <label for="sortSelect">정렬</label>
        <select id="sortSelect">
          <option value="expiry">유통기한 임박순</option>
          <option value="name">이름순</option>
        </select>
      </div>

      <ul id="ingredientList" class="ingredient-list" aria-live="polite">
        <!-- JS로 동적 생성 -->
      </ul>
      <p id="emptyMessage" class="empty-message">등록된 식재료가 없습니다. 위 폼으로 식재료를 추가해보세요!</p>
    </section>

    <!-- 요리 추천 -->
    <section id="recipes" class="tab-section" aria-labelledby="recipes-heading">
      <h2 id="recipes-heading">요리 추천</h2>
      <p class="section-desc">냉장고 속 재료로 만들 수 있는 요리를 추천해드려요.</p>
      <div id="recipeList" class="recipe-list">
        <!-- JS로 동적 생성 -->
      </div>
      <p id="recipeEmptyMessage" class="empty-message" hidden>추천할 요리가 없어요. 재료를 더 등록해보세요!</p>
    </section>

    <!-- 통계 -->
    <section id="stats" class="tab-section" aria-labelledby="stats-heading">
      <h2 id="stats-heading">통계</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number" id="totalCount">0</span>
          <span class="stat-label">전체 등록 재료</span>
        </div>
        <div class="stat-card warning">
          <span class="stat-number" id="soonCount">0</span>
          <span class="stat-label">유통기한 임박 (3일 이내)</span>
        </div>
        <div class="stat-card danger">
          <span class="stat-number" id="expiredCount">0</span>
          <span class="stat-label">유통기한 지남</span>
        </div>
        <div class="stat-card success">
          <span class="stat-number" id="savedCount">0</span>
          <span class="stat-label">누적 절약 추정(원)</span>
        </div>
      </div>
      <div class="category-stats">
        <h3>분류별 재료 개수</h3>
        <ul id="categoryStatsList"></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 냉프렌드 | 자취생을 위한 냉장고 관리 프로젝트 (개인 포트폴리오)</p>
    </div>
  </footer>

  <script>
// ===== 데이터 & 상태 =====
const STORAGE_KEY = 'fridge_ingredients_v1';
let ingredients = loadIngredients();
const AVG_PRICE_PER_ITEM = 3000; // 절약 추정 계산용 임의 단가(원)

// 간단 레시피 규칙 DB: 필요한 재료(키워드) -> 요리
const RECIPE_DB = [
  { name: '계란볶음밥', need: ['계란', '밥', '파'], desc: '계란과 남은 밥, 파만 있으면 완성!' },
  { name: '김치찌개', need: ['김치', '돼지고기', '두부'], desc: '신 김치와 돼지고기로 뚝딱.' },
  { name: '된장찌개', need: ['두부', '애호박', '된장'], desc: '기본 재료로 만드는 든든한 한 끼.' },
  { name: '계란말이', need: ['계란', '당근', '파'], desc: '자취생 필수 반찬.' },
  { name: '라면+계란', need: ['라면', '계란'], desc: '기본 중의 기본 조합.' },
  { name: '두부조림', need: ['두부', '간장', '파'], desc: '간단하고 저렴한 밑반찬.' },
  { name: '야채볶음', need: ['양파', '당근', '애호박'], desc: '냉장고 파먹기 대표 메뉴.' },
  { name: '토스트', need: ['식빵', '계란', '치즈'], desc: '아침용 초간단 메뉴.' },
];

// ===== DOM 참조 =====
const form = document.getElementById('ingredientForm');
const listEl = document.getElementById('ingredientList');
const emptyMsg = document.getElementById('emptyMessage');
const alertBanner = document.getElementById('alertBanner');
const sortSelect = document.getElementById('sortSelect');
const recipeList = document.getElementById('recipeList');
const recipeEmptyMsg = document.getElementById('recipeEmptyMessage');

// 통계 요소
const totalCountEl = document.getElementById('totalCount');
const soonCountEl = document.getElementById('soonCount');
const expiredCountEl = document.getElementById('expiredCount');
const savedCountEl = document.getElementById('savedCount');
const categoryStatsList = document.getElementById('categoryStatsList');

// 탭(메뉴) 관련
const navLinks = document.querySelectorAll('.nav-link');
const tabSections = document.querySelectorAll('.tab-section');
const menuToggle = document.getElementById('menuToggle');
const mainNav = document.querySelector('.main-nav');

// ===== 초기화 =====
document.addEventListener('DOMContentLoaded', () => {
  renderAll();
});

// ===== 탭 전환 =====
navLinks.forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    const target = link.dataset.tab;

    navLinks.forEach(l => l.classList.remove('active'));
    link.classList.add('active');

    tabSections.forEach(sec => {
      sec.classList.toggle('active', sec.id === target);
    });

    mainNav.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  });
});

menuToggle.addEventListener('click', () => {
  const isOpen = mainNav.classList.toggle('open');
  menuToggle.setAttribute('aria-expanded', String(isOpen));
});

// ===== 폼 제출 =====
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('foodName').value.trim();
  const expiry = document.getElementById('expiryDate').value;
  const category = document.getElementById('foodCategory').value;

  if (!name || !expiry) return;

  ingredients.push({
    id: Date.now(),
    name,
    expiry,
    category,
  });

  saveIngredients();
  form.reset();
  renderAll();
});

// ===== 정렬 변경 =====
sortSelect.addEventListener('change', renderIngredientList);

// ===== 렌더링 총괄 =====
function renderAll() {
  renderIngredientList();
  renderAlertBanner();
  renderRecipes();
  renderStats();
}

// ===== 재료 목록 렌더링 =====
function renderIngredientList() {
  const sorted = [...ingredients].sort((a, b) => {
    if (sortSelect.value === 'name') {
      return a.name.localeCompare(b.name);
    }
    return new Date(a.expiry) - new Date(b.expiry);
  });

  listEl.innerHTML = '';

  if (sorted.length === 0) {
    emptyMsg.hidden = false;
    return;
  }
  emptyMsg.hidden = true;

  sorted.forEach(item => {
    const days = daysUntil(item.expiry);
    const li = document.createElement('li');
    li.className = 'ingredient-item';

    let badgeClass = 'badge-fresh';
    let badgeText = `D-${days}`;
    if (days < 0) {
      li.classList.add('expired');
      badgeClass = 'badge-expired';
      badgeText = '유통기한 지남';
    } else if (days <= 3) {
      li.classList.add('soon');
      badgeClass = 'badge-soon';
      badgeText = days === 0 ? '오늘까지!' : `D-${days} (임박)`;
    }

    li.innerHTML = `
      <span class="item-name">${escapeHTML(item.name)}</span>
      <span class="item-meta">분류: ${item.category} · 유통기한: ${item.expiry}</span>
      <span class="item-badge ${badgeClass}">${badgeText}</span>
      <button class="btn btn-danger" data-id="${item.id}">삭제</button>
    `;
    listEl.appendChild(li);
  });

  listEl.querySelectorAll('.btn-danger').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.id);
      ingredients = ingredients.filter(i => i.id !== id);
      saveIngredients();
      renderAll();
    });
  });
}

// ===== 알림 배너 (유통기한 3일 이내) =====
function renderAlertBanner() {
  const soonItems = ingredients.filter(i => {
    const d = daysUntil(i.expiry);
    return d >= 0 && d <= 3;
  });

  if (soonItems.length === 0) {
    alertBanner.hidden = true;
    return;
  }

  alertBanner.hidden = false;
  const names = soonItems.map(i => `${i.name}(D-${daysUntil(i.expiry)})`).join(', ');
  alertBanner.textContent = `⚠️ 유통기한이 임박한 재료가 있어요: ${names}`;
}

// ===== 요리 추천 =====
function renderRecipes() {
  const myItems = ingredients.map(i => i.name);
  recipeList.innerHTML = '';

  const matched = RECIPE_DB
    .map(recipe => {
      const have = recipe.need.filter(n => myItems.includes(n));
      return { ...recipe, have, matchRate: have.length / recipe.need.length };
    })
    .filter(r => r.have.length > 0)
    .sort((a, b) => b.matchRate - a.matchRate);

  if (matched.length === 0) {
    recipeEmptyMsg.hidden = false;
    return;
  }
  recipeEmptyMsg.hidden = true;

  matched.forEach(r => {
    const card = document.createElement('div');
    card.className = 'recipe-card';
    const tags = r.have.map(n => `<span class="used-tag">${escapeHTML(n)}</span>`).join('');
    card.innerHTML = `
      <h3>${escapeHTML(r.name)} (${Math.round(r.matchRate * 100)}% 일치)</h3>
      <p>${escapeHTML(r.desc)}</p>
      <div>${tags}</div>
    `;
    recipeList.appendChild(card);
  });
}

// ===== 통계 =====
function renderStats() {
  const total = ingredients.length;
  const soon = ingredients.filter(i => { const d = daysUntil(i.expiry); return d >= 0 && d <= 3; }).length;
  const expired = ingredients.filter(i => daysUntil(i.expiry) < 0).length;
  const usedInRecipe = ingredients.length - expired; // 폐기 안 된 재료 = 절약 추정

  totalCountEl.textContent = total;
  soonCountEl.textContent = soon;
  expiredCountEl.textContent = expired;
  savedCountEl.textContent = (usedInRecipe * AVG_PRICE_PER_ITEM).toLocaleString();

  const byCategory = {};
  ingredients.forEach(i => {
    byCategory[i.category] = (byCategory[i.category] || 0) + 1;
  });

  categoryStatsList.innerHTML = '';
  if (Object.keys(byCategory).length === 0) {
    categoryStatsList.innerHTML = '<li>등록된 재료가 없습니다.</li>';
  } else {
    Object.entries(byCategory).forEach(([cat, count]) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${escapeHTML(cat)}</span><span>${count}개</span>`;
      categoryStatsList.appendChild(li);
    });
  }
}

// ===== 유틸 =====
function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  target.setHours(0, 0, 0, 0);
  const diffMs = target - today;
  return Math.round(diffMs / (1000 * 60 * 60 * 24));
}

function saveIngredients() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ingredients));
}

function loadIngredients() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function escapeHTML(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

</script>
</body>
</html>
